name: watchdog
# 毎日 12:00 JST（= 03:00 UTC）に、更新が止まっていないか確かめる
on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: poikatsu-data
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - name: 停止の確認
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PYTHONPATH: scripts
        run: python scripts/watchdog.py
      - name: 結果を保存
        if: always()
        run: bash scripts/commit.sh "watchdog $(TZ=Asia/Tokyo date +%F)"
