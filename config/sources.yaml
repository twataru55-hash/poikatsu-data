# 公式ポイント一覧＋店舗公式のクーポン・値引き。取得上限・未巡回URLはwork/discoveryに記録。
- id: paypay-event
  name: PayPay キャンペーン一覧
  url: https://paypay.ne.jp/event/
  brand_ids:
  - paypay
  - paypay-point
  - paypay-card
  kind: official
  render: static
  frequency: daily
  domains:
  - paypay.ne.jp
  - paypay-card.co.jp
  follow:
    pattern: ^https://paypay\.ne\.jp/event/(?!kisekae-|support-local)[a-z0-9-]+/$
    max_new: 20
- id: paypay-local
  name: PayPay 自治体キャンペーン一覧
