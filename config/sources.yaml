# 巡回する公式ページの固定リスト（仕様書 §6）
# render: js … JavaScript で中身が描画されるページ（Playwright で取得）
# enabled: false … URL が未確認などで一時的に止めているもの
# store_ids … そのページが特定チェーン向けのときだけ書く（空なら全店舗の一覧をモデルに渡す）

- id: paypay-event
  name: PayPay キャンペーン一覧
  url: https://paypay.ne.jp/event/
  brand_ids: [paypay, paypay-point, paypay-card]
  kind: official
  render: static
  frequency: daily
  domains: [paypay.ne.jp, paypay-card.co.jp]
  follow:                       # 一覧から個別キャンペーンの詳細ページをたどる（きせかえ・自治体一覧は除外）
    pattern: '^https://paypay\.ne\.jp/event/(?!kisekae-|support-local)[a-z0-9-]+/$'
    max_new: 8

- id: paypay-local
  name: PayPay 自治体キャンペーン一覧
  url: https://paypay.ne.jp/event/support-local/
  brand_ids: [paypay, paypay-point]
  kind: official
  render: static
  frequency: daily
  domains: [paypay.ne.jp]

- id: dpoint-campaign
  name: dポイントクラブ キャンペーン一覧
  url: https://dpoint.docomo.ne.jp/campaign/index.html
  brand_ids: [dpoint, d-barai, d-card]
  kind: official
  render: js
  frequency: daily
  domains: [docomo.ne.jp]
  follow:
    pattern: '^https://dpoint\.docomo\.ne\.jp/static/cp/lp_[0-9]+_[A-Za-z0-9]+/(?:\?[^#]*)?$'
    max_new: 8
    render: static

- id: dbarai-campaign
  name: d払い キャンペーン
  url: https://service.smt.docomo.ne.jp/keitai_payment/campaign/
  brand_ids: [d-barai, dpoint]
  kind: official
  render: js
  frequency: daily
  domains: [docomo.ne.jp]
  follow:
    pattern: '^https://service\.smt\.docomo\.ne\.jp/keitai_payment/campaign/(?:dpay_(?!list_|app_|hiraboku_|reservation(?:/|_))[A-Za-z0-9-]+_[0-9]{6}_[0-9]+|daiouseishi_goon_[0-9]{4}_[A-Za-z0-9]+)/(?:(?:index\.html))?(?:\?[^#]*)?$'
    max_new: 8
    render: static

- id: rakuten-pay-campaign
  name: 楽天ペイ キャンペーン一覧
  url: https://pay.rakuten.co.jp/campaign/
  brand_ids: [rakuten-pay, rakuten-point, rakuten-card]
  kind: official
  render: js
  frequency: daily
  domains: [rakuten.co.jp, rakuten-card.co.jp]
  follow:
    pattern: '^https://pay\.rakuten\.co\.jp/campaign/(?:20[0-9]{2}/[0-9]{4}-[a-z0-9-]+|pay-scratch|debut-bonus|hanakin|pay-mobile|pay-5and0day|digital-payroll|welcome-invitation)/(?:\?scid=wi_pym_cpn_list)?$'
    max_new: 8
    render: js

- id: rakuten-pointcard-campaign
  name: 楽天ポイントカード キャンペーン一覧
  url: https://pointcard.rakuten.co.jp/campaign/
  brand_ids: [rakuten-point]
  kind: official
  render: js
  frequency: daily
  domains: [rakuten.co.jp]
  follow:
    pattern: '^https://pointcard\.rakuten\.co\.jp/campaign/(?:[a-z0-9-]+/[0-9]{8}(?:/[a-z0-9-]+)?|mtu/[a-z0-9-]+-[0-9]{8}|(?:seiyu|sunny)/pointupday/[0-9]{8}|entire/payapp-pointcard)/(?:\?scid=wi_pym_cpn_list)?$'
    max_new: 8
    render: js

