  render: static
  frequency: daily
  domains:
  - paypay.ne.jp
- id: dpoint-campaign
  name: dポイントクラブ キャンペーン一覧
  url: https://dpoint.docomo.ne.jp/campaign/index.html
  brand_ids:
  - dpoint
  - d-barai
  - d-card
  kind: official
  render: js
  frequency: daily
  domains:
  - docomo.ne.jp
  follow:
    pattern: ^https://dpoint\.docomo\.ne\.jp/(?:static/cp/[^?#]+|cp_[0-9]+/[^?#]+)(?:\?[^#]*)?$
    max_new: 20
    render: static
- id: dbarai-campaign
  name: d払い キャンペーン
  url: https://service.smt.docomo.ne.jp/keitai_payment/campaign/
  brand_ids:
  - d-barai
  - dpoint
  kind: official
  render: js
  frequency: daily
  domains:
  - docomo.ne.jp
  follow:
    pattern: ^https://service\.smt\.docomo\.ne\.jp/keitai_payment/campaign/(?:dpay_(?!list_|app_|hiraboku_|reservation(?:/|_))[A-Za-z0-9-]+_[0-9]{6}_[0-9]+|daiouseishi_goon_[0-9]{4}_[A-Za-z0-9]+)/(?:(?:index\.html))?(?:\?[^#]*)?$
    max_new: 20
    render: static
- id: rakuten-pay-campaign
  name: 楽天ペイ キャンペーン一覧
  url: https://pay.rakuten.co.jp/campaign/
  brand_ids:
  - rakuten-pay
  - rakuten-point
  - rakuten-card
  kind: official
  render: js
  frequency: daily
  domains:
  - rakuten.co.jp
  - rakuten-card.co.jp
  follow:
    pattern: ^https://pay\.rakuten\.co\.jp/campaign/(?!$|.*(?:index|list)\.html)[^?#]+/(?:\?[^#]*)?$
    max_new: 20
    render: js
  exclude_selectors:
  - '#recommendedLinks'
  - '#ppHeader'
  - '#ppFooter'
  - '#rpoint-global-header'
  - '#rpoint-global-footer'
  - .campaign-peek
  - '#campaign-peek'
  - section.related-campaigns
  - .carouselArea
- id: rakuten-pointcard-campaign
  name: 楽天ポイントカード キャンペーン一覧
  url: https://pointcard.rakuten.co.jp/campaign/
  brand_ids:
  - rakuten-point
  kind: official
  render: js
  frequency: daily
  domains:
  - rakuten.co.jp
  follow:
    pattern: ^https://pointcard\.rakuten\.co\.jp/campaign/(?!mail/)[^?#]*[0-9]{8}[^?#]*/(?:\?[^#]*)?$
    max_new: 20
    render: js
  exclude_selectors:
  - '#recommendedLinks'
  - '#ppHeader'
  - '#ppFooter'
  - '#rpoint-global-header'
  - '#rpoint-global-footer'
  - .campaign-peek
  - '#campaign-peek'
